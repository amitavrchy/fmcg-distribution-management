name: Verify distribution workspace
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fmcg
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: fmcg_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fmcg" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://fmcg:ci-test-password@localhost:5432/fmcg_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-test-signing-secret-with-32-characters
      SEED_PASSWORD: CiTestPassword!2026
      CORS_ORIGINS: http://127.0.0.1:3000
      RUN_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - name: Browser acceptance
        env:
          PLAYWRIGHT_CHANNEL: chromium
        run: |
          npm run start -w backend > /tmp/fmcg-api.log 2>&1 &
          npm run start -w frontend > /tmp/fmcg-web.log 2>&1 &
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/login > /dev/null && break; sleep 1; done
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-traces
          path: test-results/
