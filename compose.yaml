services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fmcg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_DB: fmcg
    ports: ["127.0.0.1:5438:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fmcg"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6397:6379"]
    command: redis-server --appendonly yes
    volumes: ["redisdata:/data"]
volumes:
  pgdata:
  redisdata:
