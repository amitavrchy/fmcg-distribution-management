# External-runner example. Store this workflow in a separate CI configuration repository.
# The application checkout itself keeps only frontend/ and backend/ at its root.
name: Verify DeshFlow application
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fmcg
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: fmcg_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fmcg" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://fmcg:ci-test-password@localhost:5432/fmcg_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-test-signing-secret-with-32-characters
      SEED_PASSWORD: CiTestPassword!2026
      CORS_ORIGINS: http://127.0.0.1:3000
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
        with:
          repository: amitavrchy/fmcg-distribution-management
          path: app
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            app/backend/package-lock.json
            app/frontend/package-lock.json
      - run: npm ci
        working-directory: app/backend
      - run: npm ci
        working-directory: app/frontend
      - run: npx playwright install --with-deps chromium
        working-directory: app/backend
      - run: node scripts/verify.mjs --browser
        working-directory: app/backend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-traces
          path: app/backend/test-results/
